<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Waze Simples • Navegação até o Destino</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #11151d;
    --panel: #1b202b;
    --card: #262d3d;
    --cyan: #33ccff;
    --cyan-dark: #0284c7;
    --text: #ffffff;
    --muted: #9ca3af;
    --gray-route: #9aa3b2;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  html, body, #map {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #141923;
    color: var(--text);
  }

  /* Mapa escuro limpo estilo Waze */
  canvas.maplibregl-canvas {
    filter: invert(0.92) hue-rotate(192deg) saturate(1.2) brightness(0.85) contrast(1.06);
  }

  /* Balões de tempo sobre as rotas (13 min Melhor / 17 min) */
  .time-bubble {
    background: #2b3240;
    color: #fff;
    border: 2px solid #525c70;
    border-radius: 12px;
    padding: 5px 10px;
    font-size: 13px;
    font-weight: 800;
    text-align: center;
    line-height: 1.15;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
    cursor: pointer;
    white-space: nowrap;
  }
  .time-bubble.best {
    background: var(--cyan);
    color: #06131c;
    border-color: #ffffff;
  }
  .time-bubble small {
    display: block;
    font-size: 11px;
    font-weight: 700;
  }

  /* Bandeira de chegada */
  .flag-pin {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.75);
  }

  /* Cursor seta azul estilo Waze */
  .waze-cursor {
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.85));
  }

  /* BUSCA SIMPLES NO TOPO */
  .top-search-wrap {
    position: fixed;
    top: 14px;
    left: 12px;
    right: 12px;
    z-index: 30;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search-bar {
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 22px;
    padding: 8px 10px 8px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
  }
  .search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 15px;
  }
  .search-bar input::placeholder { color: var(--muted); }
  .btn-go-pill {
    background: var(--cyan);
    color: #06131c;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }

  .search-results {
    background: var(--panel);
    border: 1px solid var(--cyan);
    border-radius: 18px;
    max-height: 270px;
    overflow-y: auto;
    display: none;
    box-shadow: 0 16px 38px rgba(0, 0, 0, 0.85);
  }
  .search-results.open { display: block; }
  .search-item {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    cursor: pointer;
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover { background: rgba(51, 204, 255, 0.14); }
  .search-item strong { display: block; font-size: 14px; }
  .search-item small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* MODO 1: RESUMO DA ROTA */
  .od-box {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 35;
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 20px;
    padding: 12px 14px;
    display: none;
    align-items: center;
    gap: 10px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.75);
  }
  .od-box.open { display: flex; }
  .od-lines { flex: 1; min-width: 0; }
  .od-line {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 3px 0;
  }

  .route-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 35;
    background: var(--panel);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 14px 18px 24px;
    display: none;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 -10px 32px rgba(0, 0, 0, 0.85);
  }
  .route-sheet.open { display: flex; }

  .vehicle-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--card);
    border-radius: 999px;
    padding: 4px;
  }
  .vehicle-switch button {
    border: none;
    border-radius: 999px;
    padding: 8px;
    font-size: 17px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-weight: 700;
  }
  .vehicle-switch button.active {
    background: #6b7280;
    color: #fff;
  }

  .route-main-info {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .route-main-info strong { font-size: 24px; font-weight: 900; }
  .route-main-info span { font-size: 15px; color: var(--muted); font-weight: 700; }

  .sheet-actions {
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 10px;
  }
  .btn-gray {
    background: var(--card);
    color: var(--cyan);
    border: none;
    border-radius: 999px;
    padding: 15px 16px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .btn-cyan {
    background: var(--cyan);
    color: #06131c;
    border: none;
    border-radius: 999px;
    padding: 15px 18px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
  }

  /* MODO 2: NAVEGANDO ATÉ O LOCAL */
  .nav-top {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    background: #090c12;
    padding: 16px 18px;
    display: none;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.85);
  }
  .nav-top.open { display: flex; }
  .nav-top .dist { font-size: 24px; font-weight: 900; line-height: 1.1; }
  .nav-top .street { font-size: 20px; font-weight: 800; color: var(--cyan); margin-top: 2px; }

  .round-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(27, 32, 43, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .speed-circle {
    position: fixed;
    left: 14px;
    bottom: 94px;
    z-index: 36;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: rgba(17, 21, 29, 0.94);
    border: 3px solid #4b5563;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .speed-circle.open { display: flex; }
  .speed-circle strong { font-size: 20px; font-weight: 900; line-height: 1; }
  .speed-circle span { font-size: 10px; color: var(--muted); font-weight: 700; }

  .report-circle {
    position: fixed;
    right: 14px;
    bottom: 94px;
    z-index: 36;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #3d3214;
    border: 2px solid #facc15;
    color: #facc15;
    font-size: 24px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .report-circle.open { display: flex; }

  .nav-side-stack {
    position: fixed;
    right: 12px;
    top: 112px;
    z-index: 36;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .nav-side-stack.open { display: flex; }

  .current-road-pill {
    position: fixed;
    left: 50%;
    bottom: 162px;
    transform: translateX(-50%);
    z-index: 34;
    background: #0c1017;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 700;
    display: none;
    white-space: nowrap;
    max-width: calc(100vw - 150px);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .current-road-pill.open { display: block; }

  .nav-bottom {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    background: var(--panel);
    border-top-left-radius: 22px;
    border-top-right-radius: 22px;
    padding: 12px 16px 20px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.85);
  }
  .nav-bottom.open { display: flex; }
  .eta-box { text-align: center; flex: 1; }
  .eta-box strong { font-size: 24px; font-weight: 900; display: block; line-height: 1.1; }
  .eta-box span { font-size: 14px; color: #d1d5db; font-weight: 700; }
</style>
</head>
<body>

<div id="map"></div>

<!-- BUSCA SIMPLES -->
<div class="top-search-wrap" id="topSearchWrap">
  <div class="search-bar">
    <span style="color:var(--cyan);font-size:18px">🔍</span>
    <input id="destInput" type="text" placeholder="Para onde você quer ir?" autocomplete="off" />
    <button class="btn-go-pill" id="btnSearchDest">Ir</button>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<!-- TOPO ORIGEM / DESTINO (MODO ROTAS) -->
<div class="od-box" id="odBox">
  <button class="round-btn" id="btnBackSearch">‹</button>
  <div class="od-lines">
    <div class="od-line"><span style="color:var(--muted)">◉</span> Seu local</div>
    <div style="height:1px;background:rgba(255,255,255,0.1);margin:3px 0"></div>
    <div class="od-line"><span style="color:var(--cyan)">📍</span> <span id="odDestText">Destino</span></div>
  </div>
</div>

<!-- CARTÃO INFERIOR DE ROTAS (MODO ROTAS) -->
<section class="route-sheet" id="routeSheet">
  <div class="vehicle-switch">
    <button class="active" id="modeCar">🚗</button>
    <button id="modeMoto">🏍️</button>
  </div>

  <div class="route-main-info">
    <strong id="sheetMin">13 min</strong>
    <span id="sheetKm">7,1 km</span>
  </div>
  <div id="sheetVia" style="font-size:14px;color:#e5e7eb;margin-top:-6px">Melhor rota</div>

  <div class="sheet-actions">
    <button class="btn-gray" id="btnSimRoute">▶ Simular</button>
    <button class="btn-cyan" id="btnStartNow">Ir agora</button>
  </div>
</section>

<!-- TOPO DA NAVEGAÇÃO ATIVA -->
<header class="nav-top" id="navTop">
  <svg width="46" height="46" viewBox="0 0 48 48" fill="none" style="flex-shrink:0">
    <path d="M14 40V22C14 16.4772 18.4772 12 24 12H36M36 12L28 5M36 12L28 19" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div style="flex:1;min-width:0">
    <div class="dist" id="navStepDist">100 m</div>
    <div class="street" id="navStepStreet">Siga pela rota</div>
  </div>
  <button class="round-btn" id="btnVoiceToggle">🔊</button>
</header>

<div class="nav-side-stack" id="navSideStack">
  <button class="round-btn" id="btnCenterCar" title="Centralizar">🧭</button>
  <button class="round-btn" id="btnSimToggle" title="Simular trajeto">▶</button>
</div>

<div class="current-road-pill" id="currentRoadPill">Em rota</div>

<div class="speed-circle" id="speedCircle">
  <strong id="speedNum">0</strong>
  <span>km/h</span>
</div>

<button class="report-circle" id="btnReportAlert" title="Alerta na via">⚠️</button>

<footer class="nav-bottom" id="navBottom">
  <button class="round-btn" id="btnStopNav" title="Encerrar">✕</button>
  <div class="eta-box">
    <strong id="etaClock">--:--</strong>
    <span id="etaSummary">-- min • -- km</span>
  </div>
  <button class="round-btn" id="btnShowAlts" title="Ver rotas" style="color:var(--cyan)">⑂</button>
</footer>

<script>
(() => {
  const MAP_STYLE = {
    version: 8,
    sources: {
      osm: {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '© OpenStreetMap'
      }
    },
    layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
  };

  const state = {
    mode: 'search', // 'search' | 'routes' | 'nav'
    vehicle: 'car',
    voice: true,
    userPos: { lat: -22.2148, lng: -49.9462 },
    heading: 0,
    dest: null,
    routes: [],
    routeIdx: 0,
    simTimer: null,
    simIdx: 0
  };

  function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const r = d => (d * Math.PI) / 180;
    const a = Math.sin(r(lat2 - lat1) / 2) ** 2 +
      Math.cos(r(lat1)) * Math.cos(r(lat2)) * Math.sin(r(lng2 - lng1) / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function bearingDeg(lat1, lng1, lat2, lng2) {
    const r = d => (d * Math.PI) / 180;
    const d = x => (x * 180) / Math.PI;
    const y = Math.sin(r(lng2 - lng1)) * Math.cos(r(lat2));
    const x = Math.cos(r(lat1)) * Math.sin(r(lat2)) -
      Math.sin(r(lat1)) * Math.cos(r(lat2)) * Math.cos(r(lng2 - lng1));
    return (d(Math.atan2(y, x)) + 360) % 360;
  }

  function fmtMin(sec) {
    return `${Math.max(1, Math.round(sec / 60))} min`;
  }

  function fmtKm(meters) {
    const km = meters / 1000;
    return km >= 1 ? `${km.toFixed(1).replace('.', ',')} km` : `${Math.round(meters)} m`;
  }

  function fmtArrival(sec) {
    const dt = new Date(Date.now() + sec * 1000);
    return dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function speak(msg) {
    if (!state.voice || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(msg);
      u.lang = 'pt-BR';
      window.speechSynthesis.speak(u);
    } catch (_) {}
  }

  const map = new maplibregl.Map({
    container: 'map',
    style: MAP_STYLE,
    center: [state.userPos.lng, state.userPos.lat],
    zoom: 14,
    pitch: 40,
    bearing: 0
  });

  let styleLoaded = false;
  let carMarker = null;
  let carSvg = null;
  let flagMarker = null;
  let bubbleMarkers = [];

  function ensureArrowSprite() {
    if (!map || map.hasImage('waze-arrow-icon')) return;
    const size = 26;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(size / 2, 3);
    ctx.lineTo(size - 5, size - 5);
    ctx.lineTo(size / 2, size - 10);
    ctx.lineTo(5, size - 5);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#0369a1';
    ctx.stroke();
    map.addImage('waze-arrow-icon', canvas.getContext('2d').getImageData(0, 0, size, size));
  }

  map.on('load', () => {
    styleLoaded = true;
    ensureArrowSprite();
    syncCarMarker();
    drawRoutes();
  });

  map.on('style.load', () => {
    styleLoaded = true;
    ensureArrowSprite();
    syncCarMarker();
    drawRoutes();
  });

  function createCarCursorEl() {
    const el = document.createElement('div');
    el.className = 'waze-cursor';
    el.innerHTML = `
      <svg id="carArrowSvg" width="54" height="54" viewBox="0 0 64 64" style="transition:transform 0.25s ease;">
        <circle cx="32" cy="34" r="23" fill="rgba(51,204,255,0.22)" />
        <path d="M32 8 L51 50 L32 41 L13 50 Z" fill="#33ccff" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
      </svg>
    `;
    return el;
  }

  function getRouteHeading() {
    const coords = state.routes[state.routeIdx]?.geometry?.coordinates;
    if (Array.isArray(coords) && coords.length >= 2) {
      const i = Math.min(state.simIdx, coords.length - 2);
      const a = coords[i];
      const b = coords[Math.min(i + 2, coords.length - 1)];
      return bearingDeg(a[1], a[0], b[1], b[0]);
    }
    return state.heading;
  }

  function syncCarMarker() {
    if (!map) return;
    if (!carMarker) {
      const el = createCarCursorEl();
      carSvg = el.querySelector('#carArrowSvg');
      carMarker = new maplibregl.Marker({ element: el, alignment: 'map', rotationAlignment: 'map' })
        .setLngLat([state.userPos.lng, state.userPos.lat])
        .addTo(map);
    } else {
      carMarker.setLngLat([state.userPos.lng, state.userPos.lat]);
    }
    if (carSvg) {
      carSvg.style.transform = `rotate(${state.mode === 'nav' ? getRouteHeading() : state.heading}deg)`;
    }
  }

  function clearMapRoutes() {
    bubbleMarkers.forEach(m => m.remove());
    bubbleMarkers = [];
    if (flagMarker) {
      flagMarker.remove();
      flagMarker = null;
    }
    if (!map) return;
    ['waze-arrows', 'waze-main-line', 'waze-main-border', 'waze-alt-line'].forEach(id => {
      if (map.getLayer(id)) map.removeLayer(id);
    });
    ['waze-arrows-src', 'waze-main-src', 'waze-alt-src'].forEach(id => {
      if (map.getSource(id)) map.removeSource(id);
    });
  }

  function buildRouteArrows(coords) {
    const features = [];
    if (!Array.isArray(coords) || coords.length < 2) return { type: 'FeatureCollection', features };
    const step = Math.max(1, Math.floor(coords.length / 20));
    for (let i = 0; i < coords.length - 1; i += step) {
      const a = coords[i];
      const b = coords[i + 1];
      features.push({
        type: 'Feature',
        properties: { rot: bearingDeg(a[1], a[0], b[1], b[0]) },
        geometry: { type: 'Point', coordinates: a }
      });
    }
    return { type: 'FeatureCollection', features };
  }

  function drawRoutes() {
    if (!map || !state.routes.length) return;
    if (!styleLoaded && !map.loaded()) {
      map.once('style.load', () => {
        styleLoaded = true;
        drawRoutes();
      });
      return;
    }

    clearMapRoutes();
    ensureArrowSprite();

    const active = state.routes[state.routeIdx];
    const alts = state.routes.filter((_, i) => i !== state.routeIdx);

    if (state.mode === 'routes' && alts.length) {
      map.addSource('waze-alt-src', {
        type: 'FeatureCollection',
        data: {
          type: 'FeatureCollection',
          features: alts.map(r => ({ type: 'Feature', geometry: r.geometry }))
        }
      });
      map.addLayer({
        id: 'waze-alt-line',
        type: 'line',
        source: 'waze-alt-src',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#9aa3b2', 'line-width': 7, 'line-opacity': 0.85 }
      });
    }

    map.addSource('waze-main-src', {
      type: 'Feature',
      data: { type: 'Feature', geometry: active.geometry }
    });
    map.addLayer({
      id: 'waze-main-border',
      type: 'line',
      source: 'waze-main-src',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#0284c7', 'line-width': 13, 'line-opacity': 0.95 }
    });
    map.addLayer({
      id: 'waze-main-line',
      type: 'line',
      source: 'waze-main-src',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#33ccff', 'line-width': 8, 'line-opacity': 1 }
    });

    map.addSource('waze-arrows-src', {
      type: 'FeatureCollection',
      data: buildRouteArrows(active.geometry.coordinates)
    });
    if (map.hasImage('waze-arrow-icon')) {
      map.addLayer({
        id: 'waze-arrows',
        type: 'symbol',
        source: 'waze-arrows-src',
        layout: {
          'icon-image': 'waze-arrow-icon',
          'icon-size': 0.85,
          'icon-rotate': ['get', 'rot'],
          'icon-rotation-alignment': 'map',
          'icon-allow-overlap': true,
          'icon-ignore-placement': true
        }
      });
    }

    if (state.dest) {
      const fEl = document.createElement('div');
      fEl.className = 'flag-pin';
      fEl.textContent = '🏁';
      flagMarker = new maplibregl.Marker({ element: fEl })
        .setLngLat([state.dest.lng, state.dest.lat])
        .addTo(map);
    }

    if (state.mode === 'routes') {
      state.routes.forEach((rt, idx) => {
        const coords = rt.geometry.coordinates;
        const pos = coords[Math.floor(coords.length * (idx === 0 ? 0.52 : 0.35))] || coords[0];
        const bubble = document.createElement('div');
        bubble.className = `time-bubble ${idx === state.routeIdx ? 'best' : ''}`;
        bubble.innerHTML = `${fmtMin(rt.duration)}${idx === 0 ? '<small>Melhor</small>' : ''}`;
        bubble.onclick = () => chooseRoute(idx);
        bubbleMarkers.push(new maplibregl.Marker({ element: bubble }).setLngLat(pos).addTo(map));
      });
    }
  }

  function applyModeUI(mode) {
    state.mode = mode;
    document.getElementById('topSearchWrap').style.display = mode === 'search' ? 'flex' : 'none';
    document.getElementById('odBox').classList.toggle('open', mode === 'routes');
    document.getElementById('routeSheet').classList.toggle('open', mode === 'routes');
    document.getElementById('navTop').classList.toggle('open', mode === 'nav');
    document.getElementById('navSideStack').classList.toggle('open', mode === 'nav');
    document.getElementById('currentRoadPill').classList.toggle('open', mode === 'nav');
    document.getElementById('speedCircle').classList.toggle('open', mode === 'nav');
    document.getElementById('reportCircle').classList.toggle('open', mode === 'nav');
    document.getElementById('navBottom').classList.toggle('open', mode === 'nav');
  }

  async function buildRoutes(dest) {
    const o = [state.userPos.lng, state.userPos.lat];
    const d = [dest.lng, dest.lat];
    try {
      const res = await fetch(
        `https://router.project-osrm.org/route/v1/driving/${o[0]},${o[1]};${d[0]},${d[1]}?overview=full&geometries=geojson&steps=true&alternatives=true`
      );
      if (res.ok) {
        const json = await res.json();
        if (json.routes && json.routes.length) {
          return json.routes.map((r, i) => ({
            distance: r.distance,
            duration: state.vehicle === 'moto' ? r.duration * 0.85 : r.duration,
            via: r.legs?.[0]?.summary || (i === 0 ? 'Melhor rota' : `Rota alternativa ${i + 1}`),
            geometry: r.geometry,
            steps: (r.legs?.[0]?.steps || []).map(s => ({
              street: s.name || dest.title,
              distance: s.distance || 100
            }))
          }));
        }
      }
    } catch (_) {}

    const km = Math.max(0.6, haversineKm(o[1], o[0], d[1], d[0]));
    const mid = [(o[0] + d[0]) / 2, (o[1] + d[1]) / 2];
    const altPt = [mid[0] + 0.006, mid[1] - 0.005];
    return [
      {
        distance: km * 1150,
        duration: (km / 38) * 3600,
        via: 'Melhor rota',
        geometry: { type: 'LineString', coordinates: [o, mid, d] },
        steps: [{ street: dest.title, distance: km * 1150 }]
      },
      {
        distance: km * 1300,
        duration: (km / 34) * 3600,
        via: 'Rota alternativa',
        geometry: { type: 'LineString', coordinates: [o, altPt, d] },
        steps: [{ street: dest.title, distance: km * 1300 }]
      }
    ];
  }

  function chooseRoute(idx) {
    state.routeIdx = idx;
    const rt = state.routes[idx];
    if (!rt) return;
    document.getElementById('sheetMin').textContent = fmtMin(rt.duration);
    document.getElementById('sheetKm').textContent = fmtKm(rt.distance);
    document.getElementById('sheetVia').textContent = `${rt.via} • Trânsito normal`;
    drawRoutes();
  }

  async function openRoutePreview(dest) {
    stopSim();
    state.dest = dest;
    state.routes = await buildRoutes(dest);
    document.getElementById('odDestText').textContent = dest.title;
    applyModeUI('routes');
    chooseRoute(0);

    const bounds = new maplibregl.LngLatBounds();
    state.routes[0].geometry.coordinates.forEach(c => bounds.extend(c));
    map.fitBounds(bounds, { padding: { top: 130, bottom: 250, left: 40, right: 40 }, pitch: 15, bearing: 0 });
  }

  // BUSCA
  const destInput = document.getElementById('destInput');
  const searchResults = document.getElementById('searchResults');

  async function runSearch(query) {
    const q = query.trim();
    if (!q) {
      searchResults.classList.remove('open');
      return;
    }

    const coordMatch = q.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
    if (coordMatch) {
      const lat = parseFloat(coordMatch[1]);
      const lng = parseFloat(coordMatch[2]);
      searchResults.classList.remove('open');
      openRoutePreview({ title: `${lat.toFixed(5)}, ${lng.toFixed(5)}`, address: 'Coordenadas', lat, lng });
      return;
    }

    try {
      const r = await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&countrycodes=br&limit=5&q=${encodeURIComponent(q + ' Marília SP')}`,
        { headers: { 'Accept-Language': 'pt-BR' } }
      );
      const list = r.ok ? await r.json() : [];
      if (!list.length) {
        searchResults.innerHTML = `<div class="search-item"><strong>Local não encontrado</strong><small>Tente outro endereço ou ponto</small></div>`;
      } else {
        searchResults.innerHTML = list.map((it, i) => `
          <div class="search-item" data-idx="${i}">
            <strong>${it.display_name.split(',')[0]}</strong>
            <small>${it.display_name}</small>
          </div>
        `).join('');
        searchResults.querySelectorAll('.search-item').forEach((el, i) => {
          el.onclick = () => {
            const item = list[i];
            destInput.value = item.display_name.split(',')[0];
            searchResults.classList.remove('open');
            openRoutePreview({
              title: item.display_name.split(',')[0],
              address: item.display_name,
              lat: parseFloat(item.lat),
              lng: parseFloat(item.lon)
            });
          };
        });
      }
      searchResults.classList.add('open');
    } catch (_) {}
  }

  let debounceT;
  destInput.addEventListener('input', () => {
    clearTimeout(debounceT);
    debounceT = setTimeout(() => runSearch(destInput.value), 250);
  });
  destInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      runSearch(destInput.value);
    }
  });
  document.getElementById('btnSearchDest').onclick = () => runSearch(destInput.value);

  document.getElementById('btnBackSearch').onclick = () => {
    stopSim();
    clearMapRoutes();
    applyModeUI('search');
  };

  document.getElementById('modeCar').onclick = async () => {
    state.vehicle = 'car';
    document.getElementById('modeCar').classList.add('active');
    document.getElementById('modeMoto').classList.remove('active');
    if (state.dest) {
      state.routes = await buildRoutes(state.dest);
      chooseRoute(0);
    }
  };

  document.getElementById('modeMoto').onclick = async () => {
    state.vehicle = 'moto';
    document.getElementById('modeMoto').classList.add('active');
    document.getElementById('modeCar').classList.remove('active');
    if (state.dest) {
      state.routes = await buildRoutes(state.dest);
      chooseRoute(0);
    }
  };

  // NAVEGAÇÃO ATIVA
  function beginNavigation(autoSim = false) {
    const rt = state.routes[state.routeIdx];
    if (!rt) return;

    state.simIdx = 0;
    applyModeUI('nav');
    drawRoutes();

    const step0 = rt.steps[0] || { distance: rt.distance, street: state.dest.title };
    document.getElementById('navStepDist').textContent = fmtKm(step0.distance);
    document.getElementById('navStepStreet').textContent = step0.street;
    document.getElementById('currentRoadPill').textContent = step0.street;
    document.getElementById('etaClock').textContent = fmtArrival(rt.duration);
    document.getElementById('etaSummary').textContent = `${fmtMin(rt.duration)} • ${fmtKm(rt.distance)}`;

    const startCoord = rt.geometry.coordinates[0];
    state.userPos = { lat: startCoord[1], lng: startCoord[0] };
    syncCarMarker();

    map.easeTo({
      center: startCoord,
      zoom: 17,
      pitch: 60,
      bearing: getRouteHeading(),
      duration: 700
    });

    speak(`Siga para ${state.dest.title}.`);
    if (autoSim) startSim();
  }

  function startSim() {
    stopSim();
    const rt = state.routes[state.routeIdx];
    const coords = rt?.geometry?.coordinates;
    if (!coords || coords.length < 2) return;

    document.getElementById('btnSimToggle').textContent = '⏹';
    state.simTimer = setInterval(() => {
      if (state.simIdx >= coords.length - 1) {
        stopSim();
        document.getElementById('navStepDist').textContent = 'Chegou';
        document.getElementById('navStepStreet').textContent = state.dest?.title || 'Destino';
        document.getElementById('speedNum').textContent = '0';
        speak('Você chegou ao destino.');
        return;
      }

      state.simIdx += 1;
      const pt = coords[state.simIdx];
      state.userPos = { lat: pt[1], lng: pt[0] };
      document.getElementById('speedNum').textContent = '45';
      syncCarMarker();

      const ratio = state.simIdx / (coords.length - 1);
      const remDist = Math.max(0, rt.distance * (1 - ratio));
      const remSec = Math.max(0, rt.duration * (1 - ratio));
      document.getElementById('etaClock').textContent = fmtArrival(remSec);
      document.getElementById('etaSummary').textContent = `${fmtMin(remSec)} • ${fmtKm(remDist)}`;

      const st = rt.steps[Math.min(rt.steps.length - 1, Math.floor(ratio * rt.steps.length))];
      if (st) {
        document.getElementById('navStepStreet').textContent = st.street;
        document.getElementById('currentRoadPill').textContent = st.street;
      }

      map.easeTo({
        center: pt,
        zoom: 17,
        pitch: 60,
        bearing: getRouteHeading(),
        duration: 500
      });
    }, 550);
  }

  function stopSim() {
    if (state.simTimer) {
      clearInterval(state.simTimer);
      state.simTimer = null;
    }
    document.getElementById('btnSimToggle').textContent = '▶';
  }

  document.getElementById('btnStartNow').onclick = () => beginNavigation(false);
  document.getElementById('btnSimRoute').onclick = () => beginNavigation(true);
  document.getElementById('btnSimToggle').onclick = () => {
    if (state.simTimer) stopSim();
    else startSim();
  };

  document.getElementById('btnCenterCar').onclick = () => {
    map.easeTo({
      center: [state.userPos.lng, state.userPos.lat],
      zoom: 17,
      pitch: 60,
      bearing: getRouteHeading(),
      duration: 600
    });
  };

  document.getElementById('btnVoiceToggle').onclick = e => {
    state.voice = !state.voice;
    e.target.textContent = state.voice ? '🔊' : '🔇';
  };

  document.getElementById('btnStopNav').onclick = () => {
    stopSim();
    clearMapRoutes();
    applyModeUI('search');
    map.easeTo({ center: [state.userPos.lng, state.userPos.lat], zoom: 14, pitch: 40, bearing: 0, duration: 600 });
  };

  document.getElementById('btnShowAlts').onclick = () => {
    stopSim();
    applyModeUI('routes');
    chooseRoute(state.routeIdx);
    const bounds = new maplibregl.LngLatBounds();
    state.routes[0].geometry.coordinates.forEach(c => bounds.extend(c));
    map.fitBounds(bounds, { padding: { top: 130, bottom: 250, left: 40, right: 40 }, pitch: 15, bearing: 0 });
  };

  document.getElementById('btnReportAlert').onclick = () => {
    new maplibregl.Marker({ color: '#f59e0b' })
      .setLngLat([state.userPos.lng, state.userPos.lat])
      .setPopup(new maplibregl.Popup().setText('⚠️ Alerta na via'))
      .addTo(map);
    speak('Alerta registrado na via.');
  };

  if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition(
      pos => {
        if (state.simTimer) return;
        if (typeof pos.coords.heading === 'number' && !Number.isNaN(pos.coords.heading)) {
          state.heading = pos.coords.heading;
        }
        state.userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        if (typeof pos.coords.speed === 'number' && !Number.isNaN(pos.coords.speed)) {
          document.getElementById('speedNum').textContent = Math.round(pos.coords.speed * 3.6);
        }
        syncCarMarker();
        if (state.mode === 'search') {
          map.flyTo({ center: [state.userPos.lng, state.userPos.lat], zoom: 14.5, pitch: 40 });
        }
      },
      () => {},
      { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
    );
  }
})();
</script>
</body>
</html>
