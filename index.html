<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Alerta GPS • Navegação Estilo Waze</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #12161f;
    --sheet: #1c212b;
    --card: #262c38;
    --border: rgba(255, 255, 255, 0.12);
    --cyan: #33ccff;
    --cyan-dark: #0099cc;
    --text: #ffffff;
    --muted: #9ca3af;
    --red: #ef4444;
    --amber: #f59e0b;
    --green: #10b981;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  html, body, #map {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #141923;
    color: var(--text);
  }

  /* Estilo visual escuro estilo Waze no mapa */
  .map-dark-filter canvas.maplibregl-canvas {
    filter: invert(0.91) hue-rotate(192deg) saturate(1.25) brightness(0.86) contrast(1.08);
  }
  .map-sat-filter canvas.maplibregl-canvas {
    filter: none;
  }

  /* Balões de tempo flutuantes sobre as rotas (Etapa 2) */
  .route-time-pill {
    background: #2b313d;
    color: #fff;
    border: 2px solid #4b5563;
    border-radius: 12px;
    padding: 5px 10px;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
    cursor: pointer;
    white-space: nowrap;
    text-align: center;
    line-height: 1.15;
  }
  .route-time-pill.best {
    background: var(--cyan);
    color: #06131c;
    border-color: #ffffff;
  }
  .route-time-pill small {
    display: block;
    font-size: 11px;
    font-weight: 700;
  }

  /* Bandeira quadriculada de chegada */
  .finish-flag-marker {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
  }

  /* Cursor 3D estilo Waze */
  .waze-car-cursor {
    width: 68px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.85));
  }

  /* Placa da via atual sobre o cursor (Etapa 3) */
  .current-street-tag {
    position: fixed;
    left: 50%;
    bottom: 158px;
    transform: translateX(-50%);
    z-index: 22;
    background: #0f131a;
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75);
    display: none;
    white-space: nowrap;
    max-width: calc(100vw - 150px);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .current-street-tag.open { display: block; }

  /* Banner de Alerta à Frente (Defesa Civil / Clima / Via) */
  .ahead-banner {
    position: fixed;
    top: 116px;
    left: 50%;
    transform: translateX(-50%);
    width: min(680px, calc(100vw - 24px));
    z-index: 45;
    background: rgba(153, 27, 27, 0.96);
    border: 1px solid #fca5a5;
    border-radius: 16px;
    padding: 10px 14px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.75);
  }
  .ahead-banner.warn {
    background: rgba(146, 64, 14, 0.96);
    border-color: #fcd34d;
  }
  .ahead-banner.open { display: flex; }
  .ahead-banner strong { font-size: 13px; display: block; }
  .ahead-banner span { font-size: 11px; color: rgba(255, 255, 255, 0.9); display: block; margin-top: 2px; }

  /* BARRA DE BUSCA INICIAL */
  .search-header {
    position: fixed;
    top: 14px;
    left: 12px;
    right: 12px;
    z-index: 40;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search-pill {
    background: var(--sheet);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 8px 12px 8px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
  }
  .search-pill input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
  }
  .search-pill input::placeholder { color: var(--muted); }

  .quick-chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .quick-chips::-webkit-scrollbar { display: none; }

  .chip-btn {
    background: rgba(28, 33, 43, 0.94);
    color: #fff;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .chip-btn.active {
    background: var(--cyan);
    color: #06131c;
    border-color: var(--cyan);
  }

  .results-dropdown {
    background: var(--sheet);
    border: 1px solid var(--cyan);
    border-radius: 18px;
    max-height: 290px;
    overflow-y: auto;
    display: none;
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.85);
  }
  .results-dropdown.open { display: block; }
  .result-item {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .result-item:last-child { border-bottom: none; }
  .result-item:hover { background: rgba(51, 204, 255, 0.14); }
  .result-item strong { font-size: 14px; color: #fff; display: block; }
  .result-item small { font-size: 12px; color: var(--muted); display: block; margin-top: 2px; }

  /* ETAPA 1: FICHA DO LOCAL (IGUAL IMAGEM 3) */
  .place-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 42;
    background: var(--sheet);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 14px 18px 24px;
    box-shadow: 0 -12px 36px rgba(0, 0, 0, 0.8);
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  .place-sheet.open { display: flex; }
  .sheet-handle {
    width: 40px;
    height: 4px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.25);
    margin: 0 auto 2px;
  }
  .place-actions-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .place-action-box {
    background: var(--card);
    border: none;
    border-radius: 14px;
    padding: 10px 6px;
    color: var(--cyan);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    text-decoration: none;
  }
  .btn-waze-cyan {
    width: 100%;
    background: var(--cyan);
    color: #06131c;
    border: none;
    border-radius: 999px;
    padding: 15px 20px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(51, 204, 255, 0.35);
  }
  .btn-waze-cyan:active { transform: scale(0.99); }

  /* ETAPA 2: PAINEL DE ROTAS (IGUAL IMAGEM 1) */
  .routes-top-card {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 44;
    background: var(--sheet);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px 14px;
    display: none;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
  }
  .routes-top-card.open { display: flex; }
  .od-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 700;
    padding: 4px 0;
  }

  .routes-bottom-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 44;
    background: var(--sheet);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 14px 18px 24px;
    box-shadow: 0 -12px 36px rgba(0, 0, 0, 0.85);
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  .routes-bottom-sheet.open { display: flex; }

  .vehicle-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--card);
    border-radius: 999px;
    padding: 4px;
  }
  .vehicle-btn {
    border: none;
    border-radius: 999px;
    padding: 9px;
    font-size: 18px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-weight: 700;
  }
  .vehicle-btn.active {
    background: #6b7280;
    color: #fff;
  }
  .routes-cta-row {
    display: grid;
    grid-template-columns: 1fr 1.25fr;
    gap: 10px;
  }
  .btn-waze-secondary {
    background: var(--card);
    color: var(--cyan);
    border: none;
    border-radius: 999px;
    padding: 15px 16px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }

  /* ETAPA 3: NAVEGAÇÃO TURN-BY-TURN ATIVA (IGUAL IMAGEM 2) */
  .turn-banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 48;
    background: #090b10;
    padding: 16px 18px 18px;
    display: none;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85);
  }
  .turn-banner.open { display: flex; }
  .turn-arrow-box {
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .turn-dist {
    font-size: 24px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.1;
  }
  .turn-street {
    font-size: 21px;
    font-weight: 800;
    color: var(--cyan);
    line-height: 1.2;
    margin-top: 2px;
  }

  .nav-side-controls {
    position: fixed;
    right: 12px;
    top: 112px;
    z-index: 35;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .nav-side-controls.open { display: flex; }
  .circle-fab {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(24, 29, 38, 0.94);
    border: 1px solid var(--border);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
  }

  /* Velocímetro circular estilo Waze */
  .speedometer-badge {
    position: fixed;
    left: 14px;
    bottom: 92px;
    z-index: 38;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(18, 22, 31, 0.94);
    border: 3px solid #4b5563;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.75);
  }
  .speedometer-badge strong {
    font-size: 21px;
    font-weight: 900;
    line-height: 1;
  }
  .speedometer-badge span {
    font-size: 10px;
    color: var(--muted);
    font-weight: 700;
    margin-top: 2px;
  }

  /* Botão Reportar amarelo triangular estilo Waze */
  .waze-report-fab {
    position: fixed;
    right: 14px;
    bottom: 92px;
    z-index: 38;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #3d3214;
    border: 2px solid #facc15;
    color: #facc15;
    font-size: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.75);
  }

  /* Barra inferior da navegação ativa (Etapa 3) */
  .nav-bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 46;
    background: var(--sheet);
    border-top-left-radius: 22px;
    border-top-right-radius: 22px;
    padding: 12px 16px 20px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.85);
  }
  .nav-bottom-bar.open { display: flex; }
  .eta-center {
    text-align: center;
    flex: 1;
  }
  .eta-center strong {
    font-size: 24px;
    font-weight: 900;
    display: block;
    line-height: 1.1;
  }
  .eta-center span {
    font-size: 14px;
    font-weight: 700;
    color: #d1d5db;
  }

  /* Painel auxiliar (Rádio, Defesa Civil, Rodovias SP, SOS) */
  .drawer-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    z-index: 70;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .drawer-modal.open { display: flex; }
  .drawer-card {
    width: 100%;
    max-width: 540px;
    max-height: 82vh;
    overflow-y: auto;
    background: var(--sheet);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .list-box {
    background: var(--card);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .report-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
</style>
</head>
<body class="map-dark-filter">

<div id="map"></div>

<!-- BANNER DE ALERTA À FRENTE -->
<div class="ahead-banner" id="aheadBanner">
  <div>
    <strong id="aheadTitle">⚠️ Alerta à frente</strong>
    <span id="aheadDesc">Monitorando Defesa Civil, rodovias e tempestades...</span>
  </div>
  <button class="chip-btn" id="btnCloseAhead">✕</button>
</div>

<!-- TELA INICIAL: BUSCA DE ENDEREÇO -->
<div class="search-header" id="searchHeader">
  <div class="search-pill">
    <span style="font-size:18px;color:var(--cyan)">🔍</span>
    <input id="searchInput" type="text" placeholder="Para onde vamos? (Ex: Tauste Supermercados, Marília)" autocomplete="off" />
    <button class="chip-btn active" id="btnSearchGo">Buscar</button>
  </div>

  <div class="quick-chips">
    <button class="chip-btn" id="chipMyLoc">🎯 Meu GPS</button>
    <button class="chip-btn" id="chipRoutesQuick">🛣️ Rodovias SP</button>
    <button class="chip-btn" id="chipWeatherQuick">⛈️ Clima & DC</button>
    <button class="chip-btn" id="chipRadioQuick">📻 Rádios</button>
    <button class="chip-btn" id="chipLayerToggle">🛰️ Satélite</button>
    <button class="chip-btn" id="chipSosQuick" style="border-color:#ef4444;color:#fca5a5">🆘 SOS</button>
  </div>

  <div class="results-dropdown" id="resultsDropdown"></div>
</div>

<!-- ETAPA 1: FICHA DO DESTINO (IGUAL IMAGEM 3) -->
<section class="place-sheet" id="placeSheet">
  <div class="sheet-handle"></div>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
    <div>
      <h2 id="placeTitle" style="font-size:21px;font-weight:900">Destino</h2>
      <div id="placeMeta" style="font-size:13px;color:var(--muted);margin-top:4px">4.7 km distante</div>
      <div id="placeAddress" style="font-size:13px;color:#e5e7eb;margin-top:4px">Endereço completo</div>
    </div>
    <button class="circle-fab" id="btnClosePlace" style="width:36px;height:36px;font-size:14px">✕</button>
  </div>

  <div class="place-actions-row">
    <button class="place-action-box" id="btnPlaceSave"><span>🔖</span>Salvar</button>
    <a class="place-action-box" id="btnPlaceCall" href="tel:190"><span>📞</span>Ligar</a>
    <button class="place-action-box" id="btnPlaceShare"><span>📤</span>Compartil...</button>
    <button class="place-action-box" id="btnPlaceWeather"><span>⛈️</span>Clima</button>
  </div>

  <button class="btn-waze-cyan" id="btnViewRoutes">Ver rotas</button>
</section>

<!-- ETAPA 2: SELEÇÃO DE ROTAS (IGUAL IMAGEM 1) -->
<div class="routes-top-card" id="routesTopCard">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="circle-fab" id="btnBackToPlace" style="width:36px;height:36px;font-size:16px">‹</button>
    <div style="flex:1">
      <div class="od-row"><span style="color:var(--muted)">◉</span> <span id="originLabel">Seu local</span></div>
      <div style="height:1px;background:rgba(255,255,255,0.1);margin:3px 0"></div>
      <div class="od-row"><span style="color:var(--cyan)">📍</span> <span id="destLabelRoutes">Destino</span></div>
    </div>
  </div>
</div>

<section class="routes-bottom-sheet" id="routesBottomSheet">
  <div class="vehicle-toggle">
    <button class="vehicle-btn active" id="btnModeCar">🚗 Carro</button>
    <button class="vehicle-btn" id="btnModeMoto">🏍️ Moto</button>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:baseline">
    <strong id="selectedRouteTime" style="font-size:24px;font-weight:900">13 min</strong>
    <span id="selectedRouteDist" style="font-size:15px;color:var(--muted);font-weight:700">7,1 km</span>
  </div>
  <div id="selectedRouteVia" style="font-size:14px;color:#e5e7eb;margin-top:-8px">Por via principal • Melhor rota, Trânsito normal</div>

  <div id="routeCardsRow" style="display:flex;gap:8px;overflow-x:auto"></div>

  <div class="routes-cta-row">
    <button class="btn-waze-secondary" id="btnSimPreview">▶ Simular rota</button>
    <button class="btn-waze-cyan" id="btnGoNow">Ir agora</button>
  </div>
</section>

<!-- ETAPA 3: NAVEGAÇÃO TURN-BY-TURN ATIVA (IGUAL IMAGEM 2) -->
<header class="turn-banner" id="turnBanner">
  <div class="turn-arrow-box" id="turnIconBox">
    <svg width="46" height="46" viewBox="0 0 48 48" fill="none">
      <path d="M14 40V22C14 16.4772 18.4772 12 24 12H36M36 12L28 5M36 12L28 19" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div style="flex:1;min-width:0">
    <div class="turn-dist" id="turnDistText">70 m</div>
    <div class="turn-street" id="turnStreetText">Siga pela rota</div>
  </div>
  <button class="circle-fab" id="btnToggleVoice" title="Voz">🔊</button>
</header>

<div class="nav-side-controls" id="navSideControls">
  <button class="circle-fab" id="fabRecenter" title="Centralizar carro">🧭</button>
  <button class="circle-fab" id="fabSimActive" title="Simular movimento">▶</button>
  <button class="circle-fab" id="fabRadioActive" title="Rádio ao vivo">🎵</button>
</div>

<div class="current-street-tag" id="currentStreetTag">Via atual</div>

<!-- VELOCÍMETRO E BOTÃO REPORTAR -->
<div class="speedometer-badge">
  <strong id="speedValue">0</strong>
  <span>km/h</span>
</div>

<button class="waze-report-fab" id="btnOpenReport" title="Reportar na via">⚠️</button>

<!-- BARRA INFERIOR NAVEGAÇÃO ATIVA (IGUAL IMAGEM 2) -->
<footer class="nav-bottom-bar" id="navBottomBar">
  <button class="circle-fab" id="btnEndNavigation" title="Encerrar rota" style="background:#2b313d">✕</button>
  <div class="eta-center">
    <strong id="etaArrivalClock">22:42</strong>
    <span id="etaRemainingInfo">13 min • 7.1 km</span>
  </div>
  <button class="circle-fab" id="btnSwitchAltInNav" title="Ver rotas alternativas" style="background:#2b313d;color:var(--cyan)">⑂</button>
</footer>

<!-- MODAL GERAL (RODOVIAS, CLIMA, RÁDIO, REPORTAR, SOS) -->
<div class="drawer-modal" id="drawerModal">
  <div class="drawer-card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong id="drawerTitle" style="font-size:17px">Painel</strong>
      <button class="circle-fab" id="btnCloseDrawer" style="width:34px;height:34px;font-size:14px">✕</button>
    </div>
    <div id="drawerBody" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>
</div>

<audio id="radioPlayer" preload="none"></audio>

<script>
(() => {
  const STYLE_OSM = {
    version: 8,
    sources: {
      osm: {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '© OpenStreetMap'
      }

  function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const toRad = d => (d * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function bearingDeg(lat1, lng1, lat2, lng2) {
    const toRad = d => (d * Math.PI) / 180;
    const toDeg = r => (r * 180) / Math.PI;
    const y = Math.sin(toRad(lng2 - lng1)) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
      Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lng2 - lng1));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }

  function speak(text) {
    if (!state.voice || !('speechSynthesis' in window)) return;
    try {

  function formatEtaClock(seconds) {

  function ensureChevronImage() {
    if (!map || map.hasImage('waze-chevron')) return;
    const size = 28;
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const ctx = c.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(size / 2, 4);
    ctx.lineTo(size - 5, size - 6);
    ctx.lineTo(size / 2, size - 11);
    ctx.lineTo(5, size - 6);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#0369a1';
    ctx.stroke();
    map.addImage('waze-chevron', ctx.getImageData(0, 0, size, size));
  }

  function getActiveRouteHeading() {
    const rt = state.routes[state.selectedRouteIdx];
    const coords = rt?.geometry?.coordinates;
    if (Array.isArray(coords) && coords.length >= 2) {
      const idx = Math.min(state.simStepIdx, coords.length - 2);
      const p0 = coords[idx];
      const p1 = coords[Math.min(idx + 2, coords.length - 1)];
      return bearingDeg(p0[1], p0[0], p1[1], p1[0]);
    }
    return state.heading || 0;
  }

  function updateCarMarker() {
    if (!map) return;
    if (!carMarker) {
      const el = createWazeCursorEl();
      carSvgEl = el.querySelector('#wazeArrowSvg');

        .setLngLat([state.userPos.lng, state.userPos.lat])
        .addTo(map);

    const rot = state.stage === 'nav' ? getActiveRouteHeading() : state.heading;
    if (carSvgEl) {
      carSvgEl.style.transform = `rotate(${rot}deg)`;

  function clearRouteVisuals() {
    routeBubbleMarkers.forEach(m => m.remove());

    if (!map) return;
    ['route-arrows', 'route-best-line', 'route-best-casing', 'route-alt-line'].forEach(id => {
      if (map.getLayer(id)) map.removeLayer(id);
    });
    ['route-arrows-src', 'route-best-src', 'route-alt-src'].forEach(id => {
      if (map.getSource(id)) map.removeSource(id);
    });
  }

  function buildArrowGeoJSON(coords) {
    const features = [];
    if (!Array.isArray(coords) || coords.length < 2) return { type: 'FeatureCollection', features };
    const step = Math.max(1, Math.floor(coords.length / 20));
    for (let i = 0; i < coords.length - 1; i += step) {
      const a = coords[i];
      const b = coords[i + 1];
      features.push({
        type: 'Feature',
        properties: { rot: bearingDeg(a[1], a[0], b[1], b[0]) },
        geometry: { type: 'Point', coordinates: a }
      });
    }
    return { type: 'FeatureCollection', features };
  }

  function drawAllRoutesOnMap() {
    if (!map || !state.routes.length) return;
    if (!styleReady && !map.loaded()) {
      map.once('style.load', () => {
        styleReady = true;
        drawAllRoutesOnMap();
      });
      return;
    }

    clearRouteVisuals();
    ensureChevronImage();

    const bestRoute = state.routes[state.selectedRouteIdx];
    const altFeatures = state.routes
      .filter((_, idx) => idx !== state.selectedRouteIdx)
      .map(rt => ({ type: 'Feature', geometry: rt.geometry }));

    // 1. Rotas alternativas em cinza (igual imagem 1)
    if (altFeatures.length && state.stage === 'routes') {
      map.addSource('route-alt-src', {
        type: 'FeatureCollection',
        data: { type: 'FeatureCollection', features: altFeatures }
      });
      map.addLayer({
        id: 'route-alt-line',
        type: 'line',
        source: 'route-alt-src',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#9ca3af', 'line-width': 7, 'line-opacity': 0.85 }

    // 2. Rota principal / selecionada em ciano brilhante (igual imagens 1 e 2)
    map.addSource('route-best-src', {
      type: 'Feature',
      data: { type: 'Feature', geometry: bestRoute.geometry }
    });
    map.addLayer({
      id: 'route-best-casing',

      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#0284c7', 'line-width': 13, 'line-opacity': 0.95 }
    });
    map.addLayer({
      id: 'route-best-line',
      type: 'line',
      source: 'route-best-src',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#33ccff', 'line-width': 8, 'line-opacity': 1 }
    });

    // 3. Setas direcionais ao longo da linha ciano
    map.addSource('route-arrows-src', {
      type: 'Feature',
      data: buildArrowGeoJSON(bestRoute.geometry.coordinates)
    });
    if (map.hasImage('waze-chevron')) {
      map.addLayer({
        id: 'route-arrows',
        type: 'symbol',
        source: 'route-arrows-src',
        layout: {
          'icon-image': 'waze-chevron',
          'icon-size': 0.85,
          'icon-rotate': ['get', 'rot'],
          'icon-rotation-alignment': 'map',
          'icon-allow-overlap': true,
          'icon-ignore-placement': true
        }
      });
    }

    // 4. Bandeira quadriculada no destino
    if (state.selectedPlace) {
      const flagEl = document.createElement('div');
      flagEl.className = 'finish-flag-marker';
      flagEl.textContent = '🏁';
      destFlagMarker = new maplibregl.Marker({ element: flagEl })
        .setLngLat([state.selectedPlace.lng, state.selectedPlace.lat])
        .addTo(map);
    }

    // 5. Balões de tempo flutuantes sobre cada rota na tela de escolha (Etapa 2)
    if (state.stage === 'routes') {
      state.routes.forEach((rt, idx) => {
        const coords = rt.geometry.coordinates;
        const midCoord = coords[Math.floor(coords.length * (idx === 0 ? 0.52 : 0.35))] || coords[0];
        const isBest = idx === state.selectedRouteIdx;

        pill.className = `route-time-pill ${isBest ? 'best' : ''}`;
        pill.innerHTML = `${formatDurationMin(rt.duration)}${isBest ? '<small>Melhor</small>' : ''}`;
        pill.onclick = () => selectRouteIndex(idx);

        const marker = new maplibregl.Marker({ element: pill })
          .setLngLat(midCoord)
          .addTo(map);
        routeBubbleMarkers.push(marker);
      });
    }
  }

  // BUSCA DE ENDEREÇOS

  async function searchPlaces(query) {
    const q = query.trim();
    if (!q) {
      resultsDropdown.classList.remove('open');
      return;
    }

    const ql = q.toLowerCase();
    const matches = [];

    QUICK_PLACES.filter(p => p.title.toLowerCase().includes(ql) || p.address.toLowerCase().includes(ql))
      .forEach(p => matches.push(p));

    state.favorites.filter(p => p.title.toLowerCase().includes(ql))
      .forEach(p => matches.push(p));

    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=br&limit=5&q=${encodeURIComponent(q + ' Marília SP')}`;
      const res = await fetch(url, { headers: { 'Accept-Language': 'pt-BR' } });
      if (res.ok) {
        const data = await res.json();
        data.forEach(item => {
          matches.push({
            title: item.display_name.split(',')[0],
            address: item.display_name,
            lat: parseFloat(item.lat),
            lng: parseFloat(item.lon)
          });
        });
      }
    } catch (_) {}

    if (!matches.length) {
      resultsDropdown.innerHTML = `<div class="result-item"><div><strong>Nenhum local encontrado</strong><small>Tente digitar rua, bairro ou estabelecimento</small></div></div>`;
    } else {
      resultsDropdown.innerHTML = matches.map((m, i) => `
        <div class="result-item" data-idx="${i}">
          <div>
            <strong>${m.title}</strong>
            <small>${m.address}</small>
          </div>
          <span style="color:var(--cyan);font-weight:800;font-size:12px">Selecionar ›</span>
        </div>
      `).join('');

      resultsDropdown.querySelectorAll('.result-item').forEach((row, i) => {
        row.onclick = () => {
          resultsDropdown.classList.remove('open');
          searchInput.value = matches[i].title;
          openPlaceSheet(matches[i]);
        };
      });
    }
    resultsDropdown.classList.add('open');
  }

  // ETAPA 2: CALCULAR E MOSTRAR ROTAS (IGUAL IMAGEM 1)
  async function calculateRoutesToPlace(place) {
    const origin = [state.userPos.lng, state.userPos.lat];
    const dest = [place.lng, place.lat];

    try {
      const url = `https://router.project-osrm.org/route/v1/driving/${origin[0]},${origin[1]};${dest[0]},${dest[1]}?overview=full&geometries=geojson&steps=true&alternatives=true`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        if (data.routes && data.routes.length) {
          return data.routes.map((rt, i) => {
            const leg = rt.legs?.[0];
            const viaSummary = leg?.summary || `Rota ${i + 1}`;
            return {
              distance: rt.distance,
              duration: state.vehicle === 'moto' ? rt.duration * 0.85 : rt.duration,
              via: viaSummary,
              geometry: rt.geometry,
              steps: (leg?.steps || []).map(s => ({
                instruction: s.maneuver?.instruction || (s.name ? `Siga pela ${s.name}` : `Continue em direção a ${place.title}`),
                street: s.name || place.title,
                distance: s.distance || 100,
                location: s.maneuver?.location || origin
              }))
            };
          });
        }
      }
    } catch (_) {}

    // Fallback garantido caso OSRM oscile
    const distKm = Math.max(0.8, haversineKm(origin[1], origin[0], dest[1], dest[0]));
    const mid1 = [(origin[0] + dest[0]) / 2, (origin[1] + dest[1]) / 2];
    const mid2 = [mid1[0] + 0.006, mid1[1] - 0.005];
    return [
      {
        distance: distKm * 1150,
        duration: (distKm / 38) * 3600,
        via: 'Via principal',
        geometry: { type: 'LineString', coordinates: [origin, mid1, dest] },
        steps: [
          { instruction: `Siga em direção a ${place.title}`, street: place.title, distance: distKm * 1150, location: origin }
        ]
      },
      {
        distance: distKm * 1320,
        duration: (distKm / 34) * 3600,
        via: 'Via alternativa',
        geometry: { type: 'LineString', coordinates: [origin, mid2, dest] },
        steps: [
          { instruction: `Siga pelo corredor alternativo até ${place.title}`, street: place.title, distance: distKm * 1320, location: origin }
        ]
      }
    ];
  }

  function selectRouteIndex(idx) {

  // ETAPA 3: INICIAR NAVEGAÇÃO TURN-BY-TURN (IGUAL IMAGEM 2)
  function startTurnByTurnNavigation(simulate = false) {
    const rt = state.routes[state.selectedRouteIdx];
    if (!rt) return;

    state.simStepIdx = 0;
    setStage('nav');
    drawAllRoutesOnMap();

    const firstStep = rt.steps[0] || { distance: rt.distance, street: state.selectedPlace.title };
    document.getElementById('turnDistText').textContent = formatDistKm(firstStep.distance);
    document.getElementById('turnStreetText').textContent = firstStep.street || state.selectedPlace.title;
    document.getElementById('currentStreetTag').textContent = rt.via || 'Em rota';
    document.getElementById('etaArrivalClock').textContent = formatEtaClock(rt.duration);
    document.getElementById('etaRemainingInfo').textContent = `${formatDurationMin(rt.duration)} • ${formatDistKm(rt.distance)}`;

    const startCoord = rt.geometry.coordinates[0];
    state.userPos = { lat: startCoord[1], lng: startCoord[0] };
    updateCarMarker();

    const brg = getActiveRouteHeading();
    map.easeTo({
      center: startCoord,
      zoom: 17.2,
      pitch: 62,
      bearing: brg,
      duration: 800
    });

    speak(`Iniciando navegação para ${state.selectedPlace.title}. Siga pela ${firstStep.street || rt.via}.`);

    if (simulate) {
      startSimulation();
    }
  }

  function startSimulation() {
    stopSimulation();
    const rt = state.routes[state.selectedRouteIdx];
    const coords = rt?.geometry?.coordinates;
    if (!coords || coords.length < 2) return;

    document.getElementById('fabSimActive').textContent = '⏹';
    state.simTimer = setInterval(() => {
      if (state.simStepIdx >= coords.length - 1) {
        stopSimulation();
        document.getElementById('turnDistText').textContent = 'Chegou!';
        document.getElementById('turnStreetText').textContent = state.selectedPlace?.title || 'Destino';
        document.getElementById('speedValue').textContent = '0';
        speak('Você chegou ao seu destino.');
        return;
      }

      state.simStepIdx += 1;
      const pt = coords[state.simStepIdx];
      state.userPos = { lat: pt[1], lng: pt[0] };
      document.getElementById('speedValue').textContent = '46';
      updateCarMarker();

      const progress = state.simStepIdx / (coords.length - 1);
      const remDist = Math.max(0, rt.distance * (1 - progress));
      const remSec = Math.max(0, rt.duration * (1 - progress));

      document.getElementById('etaArrivalClock').textContent = formatEtaClock(remSec);
      document.getElementById('etaRemainingInfo').textContent = `${formatDurationMin(remSec)} • ${formatDistKm(remDist)}`;

      const stepIndex = Math.min(rt.steps.length - 1, Math.floor(progress * rt.steps.length));
      const curStep = rt.steps[stepIndex];
      if (curStep) {
        document.getElementById('turnStreetText').textContent = curStep.street || state.selectedPlace.title;
        document.getElementById('currentStreetTag').textContent = curStep.street || rt.via;
      }

      const brg = getActiveRouteHeading();
      map.easeTo({
        center: pt,
        zoom: 17.2,
        pitch: 62,
        bearing: brg,
        duration: 500
      });
    }, 550);
  }

  function stopSimulation() {
    if (state.simTimer) {
      clearInterval(state.simTimer);
      state.simTimer = null;
    }
    document.getElementById('fabSimActive').textContent = '▶';
  }

  document.getElementById('btnGoNow').onclick = () => startTurnByTurnNavigation(false);
  document.getElementById('btnSimPreview').onclick = () => startTurnByTurnNavigation(true);
  document.getElementById('fabSimActive').onclick = () => {
    if (state.simTimer) stopSimulation();
    else startSimulation();
  };

  document.getElementById('fabRecenter').onclick = () => {
    map.easeTo({
      center: [state.userPos.lng, state.userPos.lat],
      zoom: 17.2,
      pitch: 62,
      bearing: getActiveRouteHeading(),
      duration: 600
    });
  };

  document.getElementById('btnToggleVoice').onclick = (e) => {
    state.voice = !state.voice;
    e.target.textContent = state.voice ? '🔊' : '🔇';
  };

  document.getElementById('btnEndNavigation').onclick = () => {
    stopSimulation();
    clearRouteVisuals();
    setStage('search');
    map.easeTo({ center: [state.userPos.lng, state.userPos.lat], zoom: 14.5, pitch: 40, bearing: 0, duration: 600 });
  };

  document.getElementById('btnSwitchAltInNav').onclick = () => {
    stopSimulation();
    setStage('routes');
    drawAllRoutesOnMap();
    const bounds = new maplibregl.LngLatBounds();
    state.routes[0].geometry.coordinates.forEach(c => bounds.extend(c));
    map.fitBounds(bounds, { padding: { top: 150, bottom: 270, left: 45, right: 45 }, pitch: 20, bearing: 0 });
  };

  // GPS EM TEMPO REAL
  function initGeolocation() {
    if (!('geolocation' in navigator)) return;
    navigator.geolocation.watchPosition(
      (pos) => {
        if (state.simTimer) return;
        const firstFix = !state.gpsLocked;
        state.gpsLocked = true;
        if (typeof pos.coords.heading === 'number' && !Number.isNaN(pos.coords.heading)) {
          state.heading = pos.coords.heading;
        }
        state.userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };

        if (typeof pos.coords.speed === 'number' && !Number.isNaN(pos.coords.speed)) {
          document.getElementById('speedValue').textContent = Math.round(pos.coords.speed * 3.6);
        }

        updateCarMarker();

        if (firstFix && state.stage === 'search') {
          map.flyTo({ center: [state.userPos.lng, state.userPos.lat], zoom: 15, pitch: 45 });
        } else if (state.stage === 'nav') {
          map.easeTo({
            center: [state.userPos.lng, state.userPos.lat],
            zoom: 17.2,
            pitch: 62,
            bearing: getActiveRouteHeading(),
            duration: 500
          });
        }
      },
      () => {},
      { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
    );
  }

  document.getElementById('chipMyLoc').onclick = () => {
    map.flyTo({ center: [state.userPos.lng, state.userPos.lat], zoom: 15.5, pitch: 45 });
  };

  document.getElementById('chipLayerToggle').onclick = (e) => {
    state.satMode = !state.satMode;
    styleReady = false;
    map.setStyle(state.satMode ? STYLE_SAT : STYLE_OSM);
    document.body.className = state.satMode ? 'map-sat-filter' : 'map-dark-filter';
    e.target.textContent = state.satMode ? '🗺️ Mapa Escuro' : '🛰️ Satélite';
  };

  // PAINÉIS EXTRAS (RODOVIAS SP, DEFESA CIVIL, RÁDIOS, REPORTAR, SOS)
  const drawerModal = document.getElementById('drawerModal');
  const drawerTitle = document.getElementById('drawerTitle');
  const drawerBody = document.getElementById('drawerBody');

  function openDrawer(title, html) {
    drawerTitle.textContent = title;
    drawerBody.innerHTML = html;
    drawerModal.classList.add('open');
  }
  document.getElementById('btnCloseDrawer').onclick = () => drawerModal.classList.remove('open');

  document.getElementById('chipRoutesQuick').onclick = () => {
    openDrawer('🛣️ Rodovias SP & Locais Rápidos', QUICK_PLACES.map((p, i) => `
      <div class="list-box">
        <div><strong>${p.title}</strong><div style="font-size:11px;color:var(--muted)">${p.address}</div></div>
        <button class="chip-btn active" data-qp="${i}">Ir</button>
      </div>
    `).join(''));
    drawerBody.querySelectorAll('[data-qp]').forEach(b => {
      b.onclick = () => {
        drawerModal.classList.remove('open');
        openPlaceSheet(QUICK_PLACES[Number(b.dataset.qp)]);
      };
    });
  };

  async function openWeatherAndCivilDefense() {
    openDrawer('⛈️ Clima & Defesa Civil', '<div class="list-box">Consultando meteorologia e alertas...</div>');
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${state.userPos.lat}&longitude=${state.userPos.lng}&current=temperature_2m,wind_speed_10m,rain,weather_code&timezone=America/Sao_Paulo`);
      const d = await r.json();
      const c = d.current;
      drawerBody.innerHTML = `
        <div class="list-box">
          <div>
            <strong>Temperatura: ${c.temperature_2m}°C</strong>
            <div style="font-size:12px;color:var(--muted)">Vento: ${c.wind_speed_10m} km/h • Chuva: ${c.rain} mm</div>
          </div>
          <span style="color:var(--cyan);font-weight:800">Agora</span>
        </div>
        <div class="list-box">
          <div>
            <strong>Defesa Civil SP (199)</strong>
            <div style="font-size:12px;color:var(--muted)">Monitoramento ativo de tempestades e alagamentos no trajeto.</div>
          </div>
          <a class="chip-btn active" href="tel:199">199</a>
        </div>
      `;
    } catch (_) {
      drawerBody.innerHTML = '<div class="list-box">Não foi possível carregar os dados meteorológicos agora.</div>';
    }
  }

  document.getElementById('chipWeatherQuick').onclick = openWeatherAndCivilDefense;
  document.getElementById('btnPlaceWeather').onclick = openWeatherAndCivilDefense;

  function openRadioDrawer() {
    const player = document.getElementById('radioPlayer');
    openDrawer('📻 Rádios ao Vivo', `
      ${RADIO_STATIONS.map((st, i) => `
        <div class="list-box">
          <strong>${st.name}</strong>
          <button class="chip-btn active" data-rad="${i}">▶ Ouvir</button>
        </div>
      `).join('')}
      <button class="chip-btn" id="btnStopRadDrawer" style="justify-content:center">⏹ Parar Rádio</button>
    `);
    drawerBody.querySelectorAll('[data-rad]').forEach(b => {
      b.onclick = () => {
        const st = RADIO_STATIONS[Number(b.dataset.rad)];
        player.src = st.url;
        player.play().catch(() => {});
      };
    });
    document.getElementById('btnStopRadDrawer').onclick = () => {
      player.pause();
      player.removeAttribute('src');
    };
  }
  document.getElementById('chipRadioQuick').onclick = openRadioDrawer;
  document.getElementById('fabRadioActive').onclick = openRadioDrawer;

  document.getElementById('btnOpenReport').onclick = () => {
    const types = ['💥 Acidente na via', '🚧 Obra / Desvio', '⛔ Interdição', '🌧️ Alagamento', '🚓 Polícia / PRF', '🕳️ Buraco na pista'];
    openDrawer('⚠️ Reportar Ocorrência', `<div class="report-grid">${types.map(t => `<button class="chip-btn" data-rep="${t}" style="justify-content:center;padding:12px">${t}</button>`).join('')}</div>`);
    drawerBody.querySelectorAll('[data-rep]').forEach(b => {
      b.onclick = () => {
        const label = b.dataset.rep;
        new maplibregl.Marker({ color: '#f59e0b' })
          .setLngLat([state.userPos.lng, state.userPos.lat])
          .setPopup(new maplibregl.Popup().setText(label))
          .addTo(map);
        drawerModal.classList.remove('open');
        document.getElementById('aheadTitle').textContent = `⚠️ Reportado: ${label}`;
        document.getElementById('aheadDesc').textContent = 'Alerta marcado no mapa para sua segurança.';
        document.getElementById('aheadBanner').classList.add('open');
        speak(`Alerta reportado: ${label}`);
      };
    });
  };

  document.getElementById('btnCloseAhead').onclick = () => document.getElementById('aheadBanner').classList.remove('open');

  document.getElementById('chipSosQuick').onclick = () => {
    openDrawer('🆘 Emergência SOS', `
      <div class="list-box"><div><strong>Sua posição GPS</strong><div style="font-size:12px;color:var(--muted)">${state.userPos.lat.toFixed(6)}, ${state.userPos.lng.toFixed(6)}</div></div></div>
      <div class="report-grid">
        <a class="chip-btn active" href="tel:190" style="justify-content:center;padding:12px">🚓 Polícia (190)</a>
        <a class="chip-btn active" href="tel:191" style="justify-content:center;padding:12px">🛣️ PRF (191)</a>
        <a class="chip-btn active" href="tel:192" style="justify-content:center;padding:12px">🚑 SAMU (192)</a>
        <a class="chip-btn active" href="tel:193" style="justify-content:center;padding:12px">🚒 Bombeiros (193)</a>
      </div>
    `);
  };

  initGeolocation();
})();
</script>
</body>
</html>
